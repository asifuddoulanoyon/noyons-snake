name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FaceWorms.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FaceWorms-apk
          path: FaceWorms.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Face Worms (latest)
          body: "Download **FaceWorms.apk** below and install it on Android. Build ${{ github.run_number }}."
          files: FaceWorms.apk
          make_latest: true
